<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="player" allowfullscreen></iframe>

    <script>
        async function startPlayer() {
            // 1. URLの末尾（?v=動画ID）から動画IDを自動取得
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');

            if (!videoId) {
                console.error("URLに ?v=動画ID を指定してください。");
                return;
            }

            try {
                // 2. 自前バックエンドから最新のキーを取得
                const res = await fetch('/api/get_key');
                if (!res.ok) throw new Error('キーの取得に失敗しました');
                
                const data = await res.json();
                let eduKey = data.key;

                if (!eduKey) throw new Error('キーが空っぽです');

                // 💡 【重要】キーの末尾にある「==」を自動で2つとも削除する
                eduKey = eduKey.replace(/==$/, '');

                // 3. パターン1（key=）のURLを組み立てて100%全画面で再生
                const targetUrl = `https://www.youtubeeducation.com/embed/${videoId}?key=${encodeURIComponent(eduKey)}`;
                document.getElementById('player').src = targetUrl;

            } catch (error) {
                console.error("エラー:", error);
            }
        }

        window.onload = startPlayer;
    </script>
</body>
</html>
