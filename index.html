<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        /* 100%全画面表示スタイル */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="player" allowfullscreen allow="autoplay"></iframe>

    <script>
        async function startPlayer() {
            // 1. URLの末尾（?v=動画ID）から動画IDを取得
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');

            if (!videoId) {
                console.error("URLに ?v=動画ID を指定してください。");
                return;
            }

            try {
                // 2. 自前バックエンドAPIから最新の教育用キーを動的に取得（フロントからは隠蔽）
                const res = await fetch('/api/get_key');
                if (!res.ok) throw new Error('キーの取得に失敗しました');
                
                const data = await res.json();
                const latestKey = data.key;

                if (!latestKey) throw new Error('取得したキーが空です');

                // 3. 【app.js仕様】最新キーを使用して内部パラメータを構築
                const config = { enc: latestKey, hideTitle: true };
                const params = new URLSearchParams({
                    autoplay: 1,
                    origin: window.location.origin,
                    embed_config: JSON.stringify(config), // JSONを文字列化して埋め込み
                    rel: 0,
                    modestbranding: 1,
                    enablejsapi: 1,
                    v: videoId
                });

                // 4. youtubeeducation.com への最終URLを生成してセット
                const targetUrl = `https://www.youtubeeducation.com/embed/${videoId}?${params.toString()}`;
                document.getElementById('player').src = targetUrl;

            } catch (error) {
                console.error("プレイヤー起動エラー:", error);
            }
        }

        // ページ読み込み時に即座に実行
        window.onload = startPlayer;
    </script>
</body>
</html>
