<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>激闘リバーシ Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>激闘リバーシ Online</h1>
        
        <div id="auth-section">
            <input type="text" id="username" placeholder="ユーザー名">
            <input type="password" id="password" placeholder="パスワード">
            <div class="auth-buttons">
                <button onclick="auth('register')">新規登録</button>
            </div>
        </div>

        <div id="status-bar">
            <span id="player-name">ゲスト</span> | 
            状態: <span id="db-status">接続中...</span>
        </div>

        <div id="board"></div>

        <div id="game-info">
            <p>現在のターン: <span id="current-turn" class="turn-black">黒 (1)</span></p>
            <button onclick="resetLocalBoard()">盤面リセット</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
