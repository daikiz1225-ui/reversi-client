<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        /* 画面に無駄な余白やスクロールバーを一切出さない、100%全画面スタイル */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="player" allowfullscreen></iframe>

    <script>
        async function startPlayer() {
            // 1. 現在のURLの末尾（?v=動画ID）から動画IDを自動で抜き取る
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');

            // もし動画IDがURLに指定されていなければ処理を中断
            if (!videoId) {
                console.error("URLに ?v=動画ID を指定してください。");
                return;
            }

            try {
                // 2. さっき作った自前のバックエンドAPI（/api/get_key）を叩いてキーをもらう
                // ※HTMLとAPIを同じVercel等にデプロイする想定なので、相対パスで指定しています
                const res = await fetch('/api/get_key');
                if (!res.ok) throw new Error('APIからキーを取得できませんでした');
                
                const data = await res.json();
                const eduKey = data.key;

                // 3. youtubeeducation.comのURLを組み立てて大画面で再生
                const targetUrl = `https://www.youtubeeducation.com/embed/${videoId}?key=${encodeURIComponent(eduKey)}`;
                document.getElementById('player').src = targetUrl;

            } catch (error) {
                console.error("エラーが発生しました:", error);
            }
        }

        // ページが読み込まれたら即実行
        window.onload = startPlayer;
    </script>
</body>
</html>
