<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player (Fixed Key Test)</title>
    <style>
        /* 100%全画面スタイル */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="player" allowfullscreen></iframe>

    <script>
        function startPlayer() {
            // 1. URLの末尾（?v=動画ID）から動画IDを自動取得
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');

            if (!videoId) {
                console.error("URLに ?v=動画ID を指定してください。");
                return;
            }

            // 💡 指定された固定キー（末尾の==あり）
            const fixedKey = "AXH1ezmwC439ouf-EPiReqOjWBqBAFTQdQ-F77V0yrSDWtxzEByWRDMHIOx29LwTbTURy8mD3Py8xKBg5F90wh1twgpwmwGAqjFG3Zv8lnKYujLD_tw2GWHXgBgJsIaSvByhye-3Azrg5PdM29Mx8NI1CeFjH2aQ9Q==";

            // 2. パターン1（key=）に固定キーを合体させてURLを生成
            const targetUrl = `https://www.youtubeeducation.com/embed/${videoId}?key=${encodeURIComponent(fixedKey)}`;

            // 3. プレイヤーにセットして再生
            document.getElementById('player').src = targetUrl;
        }

        // ページ読み込み時に実行
        window.onload = startPlayer;
    </script>
</body>
</html>
